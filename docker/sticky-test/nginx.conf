# The ingress. Plain round-robin across the three routers — deliberately NOT
# header-hashing, because header-hash affinity at the load balancer is the
# alternative solution (Option A). Hashing here would send one sticky id to one
# pod and the test would pass without the router doing anything.
events {}

http {
    upstream routers {
        server router-a:3360;
        server router-b:3360;
        server router-c:3360;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://routers;
            # Which pod served the request. This is what proves the load balancer is
            # actually spreading traffic — without it a green run could just be every
            # request landing on one pod, where pod-local stickiness already works.
            add_header X-Router-Pod $upstream_addr always;

            # Do not hold connections open to the routers: a reused upstream connection
            # pins consecutive requests to one pod and fakes a passing result.
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_read_timeout 60s;
        }
    }
}
