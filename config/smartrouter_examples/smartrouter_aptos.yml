# Smart Router Direct RPC Configuration — Aptos (APT1)
# Mode: Direct connections to public Aptos REST fullnodes (no provider-relay network — direct upstreams)
#
# 2 upstreams (HTTP):
#   1. PublicNode                (aptos-rest.publicnode.com)
#   2. Aptos Labs public fullnode (fullnode.mainnet.aptoslabs.com)
# The Aptos REST API has no websocket/subscription surface, so this example is
# HTTP-only and has no subscriptions to miss.
#
# Each node-url ends in /v1 and the router appends the request path to it, so
# call the listener at the root: GET / (ledger info), GET /accounts/0x1, and so
# on. GET /v1/... would reach the node as /v1/v1/... and 404.
#
# Run it:
#   smartrouter config/smartrouter_examples/smartrouter_aptos.yml \
#     --use-static-spec specs/

# Prometheus metrics (scrape at http://<host>:7779/metrics). "disabled" turns it off.
metrics-listen-address: "0.0.0.0:7779"

endpoints:
  - listen-address: "0.0.0.0:3360"
    chain-id: "APT1"
    api-interface: "rest"
    network-address: "0.0.0.0:3360"

direct-rpc:
  - name: "aptos-publicnode"
    group-label: "publicnode"
    chain-id: "APT1"
    api-interface: "rest"
    node-urls:
      - url: "https://aptos-rest.publicnode.com/v1"
        timeout: 10s

  - name: "aptos-labs"
    group-label: "aptos-labs"
    chain-id: "APT1"
    api-interface: "rest"
    node-urls:
      - url: "https://fullnode.mainnet.aptoslabs.com/v1"
        timeout: 10s
