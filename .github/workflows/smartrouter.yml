name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version from git
        id: ver
        run: |
          set -euo pipefail
          v=$(git describe --tags --always --dirty)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

  build:
    name: Build smartrouter (${{ matrix.targetos }}-${{ matrix.arch }})
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        targetos: [linux, darwin]
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.targetos }}
      GOARCH: ${{ matrix.arch }}
      GOAMD64: v3
      GOARM64: v8.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build smartrouter
        run: |
          GOWORK=off go build \
            -mod=readonly \
            -trimpath \
            -ldflags "-X github.com/magma-Devs/smart-router/version.Version=${{ needs.version.outputs.version }} -X github.com/magma-Devs/smart-router/version.Commit=${{ github.sha }} -w -s" \
            -o out/smartrouter ./cmd/smartrouter

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smartrouter-${{ matrix.targetos }}-${{ matrix.arch }}
          path: out/smartrouter

  build_docker:
    name: Build Docker image
    if: github.event_name != 'pull_request'
    needs: [version, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: magma-devs/smart-router
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smartrouter-linux-amd64
          path: artifacts/linux/amd64

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smartrouter-linux-arm64
          path: artifacts/linux/arm64

      - name: Make binaries executable
        run: chmod +x artifacts/linux/amd64/smartrouter artifacts/linux/arm64/smartrouter

      - name: Plan tags
        id: plan
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          push=false
          is_main=false
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF#refs/heads/}"
            if [ "$ref" = "main" ]; then
              push=true; is_main=true; tag="$VERSION"
            else
              # OCI tags must be lowercase and free of '/'; sanitize the branch name
              slug=$(echo "$ref" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9._-]|-|g')
              push=true; tag="${slug}-${VERSION}"
            fi
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "is_main=$is_main" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$push" = "true" ]; then
            base="${REGISTRY}/${IMAGE_NAME}"
            tags=("${base}:${tag}" "${base}:${tag}-${GITHUB_SHA}")
            # Dev pushes from main get a :main floating tag — `:latest` is
            # reserved for the release pipeline (final tagged versions only,
            # see .goreleaser.yaml dockers / docker_manifests blocks).
            if [ "$is_main" = "true" ]; then
              tags+=("${base}:main")
            fi
            {
              echo "tags<<EOF"
              printf '%s\n' "${tags[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Image tags::$(IFS=' '; echo "${tags[*]}")"
            echo "Planned image tags:"
            printf '  - %s\n' "${tags[@]}"
            {
              echo "### Planned image tags"
              printf -- '- `%s`\n' "${tags[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipping push: event=${{ github.event_name }} ref=${GITHUB_REF}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version is not already published (main only)
        if: steps.plan.outputs.is_main == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.plan.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists. Tag a new release (git tag vX.Y.Z) before re-merging to main."
            exit 1
          fi

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.plan.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ steps.plan.outputs.push == 'true' }}

      - name: Report pushed image
        if: steps.plan.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          echo "::notice title=Image published::digest=${DIGEST}"
          echo "Pushed image digest: ${DIGEST}"
          echo "Tags:"
          printf '  - %s\n' ${TAGS}
          {
            echo "### Pushed image"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "**Tags:**"
            for t in ${TAGS}; do echo "- \`${t}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  goreleaser_check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
