name: dev-sim-prtests Envoy Gateway

# Reports, and on request upgrades, the Envoy Gateway on the PR-gate cluster.
# The gate installs smart-router-helm-chart main, so the cluster's CRDs must
# declare every field the chart renders. A pull request that edits this file
# runs the read-only report; `apply` exists only on a manual dispatch.
#
# The cluster runs Envoy Gateway from its release install.yaml (no Helm
# release) and Gateway API CRDs installed on their own, on the standard
# channel. An upgrade applies the release's Envoy Gateway CRDs and the
# install.yaml objects without its CRDs: install.yaml also bundles Gateway
# API CRDs, of an older version and the experimental channel.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Envoy Gateway release to install
        required: true
        default: v1.8.3
      apply:
        description: Upgrade the CRDs and the controller (unchecked = report only)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/dev-sim-prtests-envoy-gateway.yml

permissions:
  contents: read

concurrency:
  # Shared with the PR gate, so an upgrade never runs under a gate deploy.
  group: pr-gate-dev-sim-prtests
  cancel-in-progress: false

jobs:
  envoy-gateway:
    name: Envoy Gateway on dev-sim-prtests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report and upgrade
        env:
          SSH_HOST: ${{ secrets.DEV_SIM_PRTESTS_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEV_SIM_PRTESTS_SSH_KEY }}
          TARGET_VERSION: ${{ inputs.version || 'v1.8.3' }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Missing repository secret DEV_SIM_PRTESTS_SSH_HOST or DEV_SIM_PRTESTS_SSH_KEY"
            exit 1
          fi
          if ! [[ "$TARGET_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.8.3, got ${TARGET_VERSION}"
            exit 1
          fi
          server="${SSH_HOST##*@}"
          echo "::add-mask::${server}"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          key_file="${work}/key"
          output="${work}/output"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o RequestTTY=no)
          remote_dir="/tmp/envoy-gateway-${TARGET_VERSION}-${GITHUB_RUN_ID}"

          if [ "$APPLY" = "true" ]; then
            release_url="https://github.com/envoyproxy/gateway/releases/download/${TARGET_VERSION}"
            mkdir "${work}/manifests"
            curl -fsSL -o "${work}/manifests/envoy-gateway-crds.yaml" "${release_url}/envoy-gateway-crds.yaml"
            curl -fsSL -o "${work}/install.yaml" "${release_url}/install.yaml"
            yq 'select(.kind != "CustomResourceDefinition" and .metadata.name != "safe-upgrades.gateway.networking.k8s.io")' \
              "${work}/install.yaml" > "${work}/manifests/controller.yaml"
            if [ "$(yq -N 'select(.spec.group != "gateway.envoyproxy.io") | .metadata.name' "${work}/manifests/envoy-gateway-crds.yaml")" != "" ]; then
              echo "::error::envoy-gateway-crds.yaml carries CRDs outside gateway.envoyproxy.io; not applying"
              exit 1
            fi
            echo "Manifests for ${TARGET_VERSION}:"
            yq -N '.kind + " " + .metadata.name' "${work}/manifests/envoy-gateway-crds.yaml" "${work}/manifests/controller.yaml"
            ssh "${ssh_opts[@]}" -o RemoteCommand=none "$SSH_HOST" "mkdir -p '${remote_dir}'"
            scp "${ssh_opts[@]}" "${work}/manifests/envoy-gateway-crds.yaml" "${work}/manifests/controller.yaml" "${SSH_HOST}:${remote_dir}/"
          fi

          remote_script=""
          IFS= read -r -d '' remote_script <<'REMOTE' || true
          set -euo pipefail
          apply="$1"
          dir="$2"
          ns=envoy-gateway-system

          report() {
            echo "== Controller image"
            kubectl get deploy -A -l control-plane=envoy-gateway \
              -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}  {.spec.template.spec.containers[0].image}{"\n"}{end}'
            echo "== Gateway API CRDs"
            kubectl get crd gateways.gateway.networking.k8s.io \
              -o go-template='version={{ index .metadata.annotations "gateway.networking.k8s.io/bundle-version" }} channel={{ index .metadata.annotations "gateway.networking.k8s.io/channel" }}{{ "\n" }}'
            echo "== Fields the chart renders"
            missing=0
            for field in \
              backendtrafficpolicies.spec.routingType \
              envoyproxies.spec.provider.kubernetes.envoyDaemonSet.pod.priorityClassName; do
              if kubectl explain "$field" --api-version=gateway.envoyproxy.io/v1alpha1 >/dev/null 2>&1; then
                echo "declared  $field"
              else
                echo "MISSING   $field"
                missing=1
              fi
            done
            return "$missing"
          }

          fields_ok=true
          report || fields_ok=false
          if [ "$apply" != "true" ]; then
            echo "== Controller config (replaced by an upgrade)"
            kubectl get configmap -n "$ns" envoy-gateway-config -o jsonpath='{.data.envoy-gateway\.yaml}'
            echo "Report only. Fields declared: ${fields_ok}"
            exit 0
          fi
          trap 'rm -rf "$dir"' EXIT

          echo "== Applying Envoy Gateway CRDs"
          kubectl apply --server-side --force-conflicts -f "${dir}/envoy-gateway-crds.yaml"
          # A Job's pod template is immutable; certgen runs once per install.
          kubectl delete job -n "$ns" eg-gateway-helm-certgen --ignore-not-found --wait=true
          echo "== Applying the controller"
          kubectl apply --server-side --force-conflicts -f "${dir}/controller.yaml"
          kubectl wait -n "$ns" --for=condition=complete job/eg-gateway-helm-certgen --timeout=180s
          kubectl rollout status -n "$ns" deploy/envoy-gateway --timeout=300s

          echo "== After upgrade"
          report
          REMOTE

          rc=0
          ssh "${ssh_opts[@]}" -o RemoteCommand=none -o ServerAliveInterval=10 "$SSH_HOST" \
            bash -s -- "$APPLY" "$remote_dir" <<< "$remote_script" >"$output" 2>&1 || rc=$?

          {
            echo "### Envoy Gateway on dev-sim-prtests (target ${TARGET_VERSION}, apply ${APPLY})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SSH_HOST_VALUE="$SSH_HOST" SERVER_VALUE="$server" perl -pe '
            for $v ($ENV{"SSH_HOST_VALUE"}, $ENV{"SERVER_VALUE"}) { s/\Q$v\E/[redacted-host]/g if length $v }
          ' "$output" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
