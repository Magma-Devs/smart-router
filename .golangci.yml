version: "2"

run:
  tests: true
  timeout: 7m

linters:
  default: none
  # For list of linters and what they do: https://golangci-lint.run/usage/linters/
  enable:
    # bodyclose, nilerr, prealloc, unparam, unused and wastedassign were added by MAG-4244: the
    # 2026-10-12 audit found the dead returns, swallowed errors, per-call allocations and dead
    # stores they report had accumulated because nothing ran them. golangci-lint v2's
    # staticcheck does NOT include the U1000 unused check; that is the separate `unused` linter.
    - bodyclose
    - copyloopvar
    - dogsled
    # dupl was added by MAG-4280 after the 2026-10-13 duplicate-code review's mechanical batch; the
    # copies it still reports are listed under exclusions below, each with the ticket that owns them.
    - dupl
    - forcetypeassert
    - gocritic
    - govet
    - importas
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - nolintlint
    - prealloc
    # staticcheck now also runs the former `stylecheck` (ST*) checks — golangci-lint v2.4+ merged
    # stylecheck into staticcheck, so listing `stylecheck` separately is an "unknown linter" error.
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    dogsled:
      max-blank-identifiers: 5
    dupl:
      threshold: 100
    gocritic:
      disabled-checks:
        - elseif
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
  exclusions:
    paths:
      - protocol/chainlib/chainproxy/rpcInterfaceMessages/grpcMessage.go
      - protocol/chainlib/grpc.go
      - protocol/chainlib/grpcproxy/dyncodec/remote_grpc_reflection.go
      - protocol/chainlib/grpcproxy/dyncodec/remote_relayer.go
      - protocol/chainlib/grpcproxy/dyncodec/remotes_test.go
    rules:
      # Tests may leak a response body, pass a constant argument, or grow a slice by append:
      # none of that is on a request path, and annotating every test site would bury the
      # production hits these three linters exist for.
      - path: _test\.go
        linters:
          - bodyclose
          - unparam
          - prealloc
      # dupl baseline (MAG-4280). Each rule names one clone pair by both files, so a new copy in the
      # same file is still reported. Test code is MAG-4281's; the generated-shape files are not
      # hand-written.
      - path: _test\.go
        linters:
          - dupl
      - path: (types/relay/grpc_service|protocol/chainlib/chainlib_mock)\.go
        linters:
          - dupl
      # The WebSocket/gRPC subscription core and pools, the JSON-RPC/Tendermint ParseMsg batch walkers
      # and the error-classification entry points are MAG-4279's structural merges: the copies
      # drifted, so unifying them is a behaviour decision, not a mechanical one. (The batch walkers
      # differ on the parse directive a one-element batch gets, which needs an owner decision.)
      - path: protocol/rpcsmartrouter/upstream_(ws|grpc)_pool\.go
        linters:
          - dupl
        text: "upstream_(ws|grpc)_pool\\.go"
      - path: protocol/rpcsmartrouter/direct_(ws|grpc)_subscription_manager\.go
        linters:
          - dupl
        text: "direct_(ws|grpc)_subscription_manager\\.go"
      - path: protocol/chainlib/(jsonRPC|tendermintRPC)\.go
        linters:
          - dupl
        text: "(jsonRPC|tendermintRPC)\\.go"
      - path: protocol/common/error_classifier\.go
        linters:
          - dupl
        text: "error_classifier\\.go"
      # Twins whose differences are the point: latency vs sync normalisation (constants, log keys),
      # sticky vs fresh selection (log text), and counter vs gauge vectors (Prometheus types).
      - path: protocol/provideroptimizer/(upstream_selector|provider_optimizer)\.go
        linters:
          - dupl
        text: "(upstream_selector|provider_optimizer)\\.go"
      - path: protocol/lavasession/consumer_session_manager\.go
        linters:
          - dupl
        text: "consumer_session_manager\\.go"
      - path: protocol/metrics/mapped_labels_(counter|gauge)_vec\.go
        linters:
          - dupl
        text: "mapped_labels_(counter|gauge)_vec\\.go"
      - linters:
          - gocritic
        text: "singleCaseSwitch"
      - linters:
          - gocritic
        text: "ifElseChain"
      # ST1003 / ST1016 are now emitted by staticcheck (stylecheck was merged in). Keep them excluded to
      # preserve the prior intent. https://github.com/dominikh/go-tools/issues/389
      - linters:
          - staticcheck
        text: "ST1003:"
      - linters:
          - staticcheck
        text: "ST1016:"
      # golangci-lint v2 folded stylecheck into staticcheck and additionally turns on the QF* "quickfix"
      # category by default. The prior config (separate stylecheck) never ran QF*, so exclude it to keep
      # this a like-for-like migration rather than expanding the lint surface with style-only refactors.
      - linters:
          - staticcheck
        text: "QF\\d+:"
      - linters:
          - staticcheck
        text: 'SA1019:.*"?github.com/golang/protobuf/proto"? is deprecated.*'
      # gRPC bumped grpc.DialContext / grpc.Dial / grpc.WithBlock /
      # grpc.WithReturnConnectionError to deprecated in v1.63 in favor of
      # grpc.NewClient. Migration is non-trivial (NewClient is lazy, no
      # context, no WithBlock semantics). The 1.x branch will keep
      # supporting the old API "throughout 1.x" per upstream — exclude
      # until a dedicated migration PR.
      - linters:
          - staticcheck
        text: 'SA1019:.*grpc\.(DialContext|Dial|WithBlock|WithReturnConnectionError) is deprecated.*'
      - path: migrations
        linters:
          - staticcheck
        text: "SA1019:"
      # The jhump/protoreflect v1 API (desc, dynamic, grpcreflect) is load-bearing across the gRPC
      # relay, pool and subscription paths, and grpc_reflection_v1alpha is what upstream nodes still
      # serve; moving to google.golang.org/protobuf's protoreflect/dynamicpb and reflection v1 is a
      # cross-package migration tracked under MAG-4243, not a lint fix.
      - linters:
          - staticcheck
        text: 'SA1019:.*"?github.com/jhump/protoreflect/(desc|dynamic|grpcreflect)"? is deprecated.*'
      - linters:
          - staticcheck
        text: 'SA1019:.*grpc_reflection_v1alpha.*'
      # h2c.NewHandler and the http2.Server it takes are replaced by http.Server.Protocols (Go 1.24+);
      # that touches the cache server, the gRPC proxy and the connection probe together, and is
      # tracked under MAG-4243.
      - linters:
          - staticcheck
        text: 'SA1019:.*golang.org/x/net/http2(/h2c.*|\.Server) is deprecated.*'
      # Error strings are matched by callers, tests and the dashboard; recasing or
      # unpunctuating them is a wire-visible change, decided per error, not by a linter.
      - linters:
          - staticcheck
        text: "ST1005:"
      # Exported error variables keep their names: renaming 23 of them is a
      # cross-package churn for style alone.
      - linters:
          - staticcheck
        text: "ST1012:"

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
